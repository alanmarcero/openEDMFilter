name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenEDMFilter_artefacts/Release

jobs:
  macos:
    if: false
    # macos-14 was retired on 2026-11-02. macos-15 is arm64 and still builds the universal binary.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openEDMFilter.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openEDMFilter.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openEDMFilter.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openEDMFilter.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openEDMFilter.vst3" "dist/openEDMFilter.vst3"
          ditto "$ARTEFACTS/AU/openEDMFilter.component" "dist/openEDMFilter.component"
          ditto "$ARTEFACTS/LV2/openEDMFilter.lv2" "dist/openEDMFilter.lv2"
          ditto "$ARTEFACTS/Standalone/openEDMFilter.app" "dist/openEDMFilter.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openEDMFilter-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openEDMFilter-macOS
          path: openEDMFilter-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture preview screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter openedm_plugin_tests.exe | Select-Object -First 1
          if (-not $exe) { throw "openedm_plugin_tests.exe was not built" }
          $env:OEF_PREVIEW = Join-Path (Get-Location) "docs/screenshots/preview.png"
          & $exe.FullName "[ui]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload preview screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshot
          path: docs/screenshots/preview.png
          if-no-files-found: ignore

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openEDMFilter.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openEDMFilter.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openEDMFilter.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openEDMFilter.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openEDMFilter-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openEDMFilter-Windows
          path: openEDMFilter-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openEDMFilter.vst3" "$ARTEFACTS/LV2/openEDMFilter.lv2" dist/
          cp "$ARTEFACTS/Standalone/openEDMFilter" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openEDMFilter-Linux.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: openEDMFilter-Linux
          path: openEDMFilter-Linux.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --output "$RUNNER_TEMP/release-body.md"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: openEDMFilter-*.zip
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true

  update-preview:
    # Commits docs/screenshots/preview.png from the Windows editor capture when UI
    # files change on main. The macOS and Linux package jobs stay disabled; this
    # job only needs the Windows build, which is the one that still runs.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.windows.result == 'success' }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: preview-screenshot
          path: preview

      - name: Commit refreshed preview if changed
        run: |
          if [ ! -f preview/preview.png ]; then
            echo "No preview artifact; leaving the screenshot unchanged."
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "Push has no parent to compare; leaving the screenshot unchanged."
            exit 0
          fi
          git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(Source|assets|Tools|tools|Tests)/' || { echo "No UI changes; keeping preview."; exit 0; }
          mkdir -p docs/screenshots
          cp preview/preview.png docs/screenshots/preview.png
          if git diff --quiet -- docs/screenshots/preview.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git pull --rebase origin main
          git push
